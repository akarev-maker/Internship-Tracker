name: Internship Tracker

on:
  schedule:
    - cron: "0 12 * * *" # 12:00 UTC daily (7am EST)
  workflow_dispatch:

permissions:
  contents: write # commit the updated applications store back
  issues: write # open an alert issue on failure

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to commit SHAs (supply-chain hardening); Dependabot bumps them.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          # Optional — enables federal postings (with real deadlines) via USAJOBS.
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python tracker.py

      - name: Persist applications store
        if: always()
        run: |
          git config user.name "tracker-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "Update applications store [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Open alert issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "⚠️ Internship tracker failed — $(date -u +%Y-%m-%d)" \
            --body "The scheduled run failed. Logs: $RUN_URL" \
            || echo "Could not open alert issue."
