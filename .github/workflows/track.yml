name: Internship Tracker

on:
  schedule:
    - cron: "0 12 * * *" # 12:00 UTC daily (7am EST)
  workflow_dispatch:

# Least privilege: the store lives in the Actions cache, not in a commit, so
# this workflow never needs write access to the repo's contents.
permissions:
  contents: read
  issues: write # open an alert issue on failure

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions pinned to commit SHAs (supply-chain hardening); Dependabot bumps them.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip

      # The applications store is your private pipeline (which roles you have
      # applied to / been rejected from), so it is cached rather than committed
      # to this public repo. A unique key per run with a shared restore prefix
      # is the write-through pattern: restore the newest, save the updated one.
      - name: Restore applications store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state
          key: applications-store-${{ github.run_id }}
          restore-keys: applications-store-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Your résumé — kept out of the public repo (see profile.toml).
          PROFILE_RESUME: ${{ secrets.PROFILE_RESUME }}
          # Optional — enables federal postings (with real deadlines) via USAJOBS.
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: python tracker.py

      - name: Open alert issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "⚠️ Internship tracker failed — $(date -u +%Y-%m-%d)" \
            --body "The scheduled run failed. Logs: $RUN_URL" \
            || echo "Could not open alert issue."
